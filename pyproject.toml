[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signingflow"
version = "0.1.0"
description = "Official Python SDK for the Signingflow operations used by skills and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Signingflow" }]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signingflow = ["resources/allowlist.json"]

[tool.coverage.run]
branch = true
source = ["signingflow"]

[tool.coverage.report]
show_missing = true
