name: SDK Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install coverage
      - run: PYTHONPATH=src python -m coverage run -m unittest discover -s tests
      - run: |
          python -m coverage json -o coverage.json
          python - << 'PY'
          import json
          totals = json.load(open("coverage.json"))["totals"]
          lines = totals["percent_statements_covered"]
          branches = totals["percent_branches_covered"]
          print(f"lines {lines:.2f}% branches {branches:.2f}%")
          open(".coverage-percent", "w").write(str(lines))
          if lines < 80 or branches < 80:
              raise SystemExit("coverage is below 80%")
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python == '3.11'
        with:
          name: coverage-percent
          path: .coverage-percent
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat .coverage-percent)"
