name: SDK Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install coverage
      - run: PYTHONPATH=src python -m coverage run -m unittest discover -s tests
      - run: |
          python -m coverage json -o coverage.json
          python - << 'PY'
          import json
          totals = json.load(open("coverage.json"))["totals"]
          lines = totals["percent_statements_covered"]
          branches = totals["percent_branches_covered"]
          print(f"lines {lines:.2f}% branches {branches:.2f}%")
          if lines < 80 or branches < 80:
              raise SystemExit("coverage is below 80%")
          PY
